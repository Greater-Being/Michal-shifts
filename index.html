<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>משמרות ושכר</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משמרות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--mute:#8E8E93;--sep:rgba(60,60,67,.18);--blue:#007AFF;--green:#34C759;--greenInk:#1F7A3A;--orange:#FF9500;--red:#FF3B30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Heebo','Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.35;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:rgba(242,242,247,.74);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:.5px solid var(--sep)}
header .month{flex:1;font-size:20px;font-weight:700;padding:8px;text-align:center}
.icon{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);color:var(--blue);display:grid;place-items:center;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06)}
.icon:active{background:#fff;transform:scale(.94)}
main{max-width:560px;margin:0 auto;padding:14px 16px 0}
.hero{border-radius:26px;padding:22px 20px;margin-bottom:12px;color:var(--ink);background:linear-gradient(120deg,#BDAEF6 0%,#F5A9D2 38%,#FAB67E 70%,#F8DA7B 100%)}
.hl{font-size:15px;font-weight:500;opacity:.7}
.big{font-size:58px;font-weight:800;line-height:1.1;margin:4px 0;letter-spacing:-1px}
.sub{font-size:13px;opacity:.65}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tile,.card{background:var(--card);border-radius:22px;padding:16px}
.tile span,.card .t{display:block;font-size:14px;color:var(--mute)}
.tile b{display:block;font-size:30px;font-weight:700;margin:2px 0;letter-spacing:-.5px}
.tile i{font-style:normal;font-size:13px;color:var(--mute)}
.tile.cash b{color:var(--greenInk)}
.card{margin-bottom:12px}
.pay b.v{display:block;font-size:34px;font-weight:700;margin:2px 0 8px;letter-spacing:-.5px}
.bd{display:flex;justify-content:space-between;padding:9px 0;border-top:.5px solid var(--sep);font-size:16px}
.bd span:first-child{color:var(--mute)}
.bd span:last-child{font-weight:600}
.bd.tot span{color:var(--ink);font-weight:700}
.bd.cov span{color:var(--greenInk);font-weight:600}
.status{border-radius:22px;padding:16px;margin-bottom:12px;font-size:15px}
.status.ok{background:rgba(52,199,89,.16);color:var(--greenInk)}
.status.warn{background:rgba(255,149,0,.16);color:#9A5200}
.status.idle{background:var(--card);color:var(--mute)}
.status strong{display:block;font-size:18px;margin-bottom:4px}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.1);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:5px}
.cal{background:var(--card);border-radius:22px;padding:12px 10px;margin-bottom:12px}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{text-align:center;font-size:13px;color:var(--mute);padding:4px 0 6px}
.day{aspect-ratio:1/1.12;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:17px}
.day small{font-size:11px;font-weight:700}
.day.has{background:rgba(0,122,255,.12);color:var(--blue);font-weight:600}
.day.today{background:linear-gradient(120deg,#BDAEF6 0%,#F5A9D2 38%,#FAB67E 70%,#F8DA7B 100%);color:var(--ink);font-weight:700}
.day.today small{color:var(--ink)}
.day.empty{pointer-events:none}
h3{font-size:20px;font-weight:700;margin:20px 4px 4px}
.hint{font-size:13px;color:var(--mute);margin:0 4px 10px}
.list,.group{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:12px}
.row{width:100%;display:flex;align-items:center;gap:12px;text-align:right;padding:12px 16px;border-radius:0}
.row+.row{border-top:.5px solid var(--sep)}
.row:active{background:#F2F2F7}
.row .d{min-width:56px;font-weight:700;font-size:15px}
.row .m{flex:1;font-size:14px;color:var(--mute)}
.row .m b{display:block;color:var(--ink);font-size:17px;font-weight:600}
.row .tp{font-weight:700;color:var(--greenInk)}
.row .ed{color:var(--blue);font-size:15px}
.row.act{color:var(--blue);font-weight:500;justify-content:flex-start}
.chev{color:#C7C7CC;flex:none}
.empty-note{color:var(--mute);padding:6px 4px 14px;margin:0}
.btn{display:block;width:100%;min-height:52px;border-radius:15px;font-weight:600;font-size:17px;margin-top:10px}
.btn.primary{background:var(--blue);color:#fff}
.btn.plain{background:var(--card);color:var(--blue)}
.btn.danger{background:var(--card);color:var(--red)}
.btn.dfill{background:var(--red);color:#fff}
.btn.ghost{color:var(--blue)}
.btn:active{opacity:.75}
.fab{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;min-height:58px;padding:0 22px 0 26px;border-radius:30px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 10px 30px rgba(0,0,0,.14);z-index:4}
.fab .pl{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px;line-height:1;font-weight:500}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.3);visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
#sheet.open{visibility:visible;opacity:1}
#panel{position:absolute;bottom:0;inset-inline:0;max-width:560px;margin:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;transform:translateY(30px);transition:transform .22s}
#sheet.open #panel{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;margin:0 auto 14px}
#panel h2{margin:0 4px 14px;font-size:22px;font-weight:700}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;min-height:54px;font-size:17px;margin:0}
.field+.field{border-top:.5px solid var(--sep)}
.field input{width:55%;min-width:0;min-height:44px;border:0;background:transparent;margin:0;padding:0;font-size:17px;direction:ltr;text-align:left;color:var(--blue);outline:none;-webkit-appearance:none;appearance:none}
.field:focus-within{background:#F7F7FA}

.ask{padding:14px 16px;text-align:center;font-weight:600}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(0,122,255,.1);border-radius:16px;padding:12px;margin:0 0 6px;text-align:center}
.prev span{display:block;font-size:12px;color:var(--mute)}
.prev b{font-size:19px;color:var(--blue)}
.note{font-size:13px;color:var(--mute);margin:6px 4px 0}
#toast{position:fixed;inset-inline:0;top:calc(76px + env(safe-area-inset-top,0px));margin:auto;width:max-content;max-width:90%;background:rgba(28,28,30,.9);color:#fff;padding:10px 18px;border-radius:24px;font-size:15px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="icon" data-a="prev" aria-label="חודש קודם"><svg width="10" height="17" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg></button>
  <button class="month" id="mlabel" data-a="today" aria-label="חזרה לחודש הנוכחי"></button>
  <button class="icon" data-a="next" aria-label="חודש הבא"><svg width="10" height="17" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1 1 7l6 6"/></svg></button>
  <button class="icon" data-a="settings" aria-label="הגדרות"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.9"/><circle cx="10" cy="10" r="1.9"/><circle cx="16" cy="10" r="1.9"/></svg></button>
</header>
<main id="app"></main>
<button class="fab" data-a="add"><span class="pl">+</span>משמרת חדשה</button>
<div id="sheet" data-a="backdrop"><div id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
(()=>{
'use strict';
const KEY='shift-wage-v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const todayStr=()=>{const t=new Date();return ds(t.getFullYear(),t.getMonth(),t.getDate())};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:0};
const r2=n=>Math.round(n*100)/100;
const money=n=>'₪'+r2(n).toLocaleString('he-IL',{maximumFractionDigits:2});
const hrs=n=>{const m=Math.round(n*60);return Math.floor(m/60)+':'+pad(m%60)};
const rng=s=>`מ־${s.start} עד ${s.end}`;
const pt=s=>{const m=/^(\d{2}):(\d{2})$/.exec(s||'');return m&&+m[1]<24&&+m[2]<60?+m[1]*60+ +m[2]:null};
const calcH=(s,e)=>{const a=pt(s),b=pt(e);if(a===null||b===null)return 0;let d=b-a;if(d<0)d+=1440;return d/60};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const dlabel=(s,o)=>pd(s).toLocaleDateString('he-IL',o);
const CHEV='<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1 1 7l6 6"/></svg>';

/* כל הטיפים נרשמים כמזומן; נתונים ישנים עם אשראי מאוחדים לשדה אחד */
function normShift(s){
  if(!s||!DATE_RE.test(s.date)||pt(s.start)===null||pt(s.end)===null)return null;
  return {id:String(s.id||uid()),date:s.date,start:s.start,end:s.end,cash:r2(num(s.cash)+num(s.credit))};
}

let S={settings:{minWage:35,travel:0},shifts:[],last:{start:'18:00',end:'23:00'}};
try{
  const j=JSON.parse(localStorage.getItem(KEY)||'null');
  if(j&&typeof j==='object'){
    S.settings=Object.assign(S.settings,j.settings||{});
    S.shifts=(Array.isArray(j.shifts)?j.shifts:[]).map(normShift).filter(Boolean);
    if(j.last&&pt(j.last.start)!==null&&pt(j.last.end)!==null)S.last=j.last;
  }
}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('לא הצלחתי לשמור בדפדפן')}};

const now=new Date();
let vy=now.getFullYear(),vm=now.getMonth();

let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)}

function monthShifts(y,m){
  const p=`${y}-${pad(m+1)}-`;
  return S.shifts.filter(s=>s.date.startsWith(p)).sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
}
/* התלוש המובטח = מינימום לשעות + נסיעות. הטיפים מקזזים אותו; המעסיק משלים רק את החסר */
function calc(y,m){
  const list=monthShifts(y,m);
  let hours=0,tips=0;const days=new Set();
  list.forEach(s=>{hours+=calcH(s.start,s.end);tips+=s.cash||0;days.add(s.date)});
  const required=hours*(S.settings.minWage||0);
  const travel=days.size*(S.settings.travel||0);
  const target=required+travel;
  const offset=Math.min(tips,target);
  const pay=Math.max(0,target-tips);
  const net=hours>0?(tips+pay)/hours:0;
  return {list,hours,tips,days:days.size,required,travel,target,offset,pay,net};
}

function dayStat(date){
  let h=0,t=0;S.shifts.forEach(s=>{if(s.date===date){h+=calcH(s.start,s.end);t+=s.cash||0}});
  const target=h*(S.settings.minWage||0)+(S.settings.travel||0);
  return {t,target,gap:Math.max(0,target-t),ok:t>=target};
}
function dayStatusHTML(date,label){
  const d=dayStat(date),pre=label?label+': ':'';
  if(d.ok)return `<div class="status ok"><strong>${pre}הטיפים מכסים הכל</strong>טיפים ${money(d.t)} מול ${money(d.target)} (מינימום ונסיעות).<div class="bar"><i style="width:100%"></i></div></div>`;
  return `<div class="status warn"><strong>${pre}חסרים ${money(d.gap)} לכיסוי</strong>טיפים ${money(d.t)} מול ${money(d.target)} (מינימום ונסיעות). ההשלמה בפועל נקבעת לפי סך החודש.<div class="bar"><i style="width:${Math.min(100,d.t/d.target*100)}%"></i></div></div>`;
}
function render(){
  $('#mlabel').textContent=new Date(vy,vm,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  const c=calc(vy,vm);
  let status;
  const dts=[...new Set(c.list.map(s=>s.date))].sort();
  if(!dts.length) status=`<div class="status idle"><strong>אין משמרות בחודש הזה</strong>אפשר להוסיף משמרת כדי לראות את החישוב.</div>`;
  else{const t0=todayStr(),pick=dts.includes(t0)?t0:dts[dts.length-1];status=dayStatusHTML(pick,pick===t0?'היום':dlabel(pick,{weekday:'short',day:'numeric'}))}

  const first=new Date(vy,vm,1).getDay(),dim=new Date(vy,vm+1,0).getDate(),ts=todayStr();
  const byDay={};c.list.forEach(s=>{byDay[s.date]=(byDay[s.date]||0)+calcH(s.start,s.end)});
  let cells='';
  for(let i=0;i<first;i++)cells+='<div class="day empty"></div>';
  for(let d=1;d<=dim;d++){
    const k=ds(vy,vm,d),h=byDay[k];
    cells+=`<button class="day${h?' has':''}${k===ts?' today':''}" data-a="day" data-d="${k}" aria-label="${d}">${d}${h?`<small>${hrs(h)}</small>`:''}</button>`;
  }
  const rows=c.list.map(s=>`<button class="row" data-a="edit" data-id="${s.id}"><span class="d">${dlabel(s.date,{weekday:'short',day:'numeric'})}</span><span class="m"><b>${rng(s)}</b>${hrs(calcH(s.start,s.end))} שעות</span><span class="tp">${money(s.cash||0)}</span><span class="ed">עריכה</span>${CHEV}</button>`).join('');

  $('#app').innerHTML=`
  <section class="hero"><div class="hl">ממוצע רווח לשעה (נטו בפועל)</div><div class="big">${c.hours?money(c.net):'—'}</div><div class="sub">מזומן ביד + צפי תלוש, חלקי ${hrs(c.hours)} שעות</div></section>
  <div class="grid2">
    <div class="tile"><span>סה"כ שעות</span><b>${hrs(c.hours)}</b><i>${c.days} ימי עבודה</i></div>
    <div class="tile cash"><span>מזומן ביד</span><b>${money(c.tips)}</b><i>סה"כ טיפים</i></div>
  </div>
  <section class="card pay"><span class="t">צפי לתלוש מהמעסיק</span><b class="v">${money(c.pay)}</b>
    <div class="bd"><span>שכר מינימום לשעות</span><span>${money(c.required)}</span></div>
    <div class="bd"><span>החזרי נסיעות</span><span>${money(c.travel)}</span></div>
    <div class="bd tot"><span>סה"כ מובטח בתלוש</span><span>${money(c.target)}</span></div>
    <div class="bd cov"><span>כבר מכוסה מהטיפים</span><span>✓ ${money(c.offset)}</span></div>
  </section>
  ${status}
  <section class="cal"><div class="wk">${['א','ב','ג','ד','ה','ו','ש'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells}</div></section>
  <h3>משמרות החודש</h3>
  ${rows?`<p class="hint">לחיצה על משמרת פותחת עריכה ומחיקה.</p><div class="list">${rows}</div><button class="btn plain" data-a="copy">העתק סיכום חודשי</button>`:'<p class="empty-note">עוד אין משמרות. אפשר ללחוץ על יום בלוח או על "משמרת חדשה".</p>'}`;
}

/* ---------- sheets ---------- */
const sheet=$('#sheet'),panel=$('#panel');
function openSheet(html){panel.innerHTML='<div class="grab"></div>'+html;sheet.classList.add('open');panel.scrollTop=0}
function closeSheet(){sheet.classList.remove('open')}

let editId=null;
const timeSel=(id,v)=>`<input type="time" id="${id}" value="${v}">`;
const getT=id=>$('#'+id).value;
const delBtn='<button class="btn danger" data-a="del">מחיקת משמרת</button>';
function openForm(id,date){
  const sh=id?S.shifts.find(x=>x.id===id):null;
  editId=sh?sh.id:null;
  const v=sh||{date:date||todayStr(),start:S.last.start,end:S.last.end,cash:''};
  openSheet(`<h2>${sh?'עריכת משמרת':'משמרת חדשה'}</h2>
  <div class="group">
    <label class="field">תאריך<input type="date" id="f-date" value="${v.date}"></label>
    <div class="field">התחלה${timeSel('f-start',v.start)}</div>
    <div class="field">סיום${timeSel('f-end',v.end)}</div>
    <label class="field">טיפים (₪)<input type="number" id="f-tips" inputmode="decimal" min="0" step="any" placeholder="0" value="${v.cash||''}"></label>
  </div>
  <div class="prev" id="prev"></div>
  <p class="note">לחיצה על השעה פותחת את בורר הזמן של הטלפון. משמרת שחוצה חצות מחושבת נכון ונספרת ליום ההתחלה.</p>
  <button class="btn primary" data-a="save">שמירה</button>
  <div id="delbox">${sh?delBtn:''}</div>
  <button class="btn ghost" data-a="close">ביטול</button>`);
  preview();
}
function preview(){
  const p=$('#prev');if(!p)return;
  const h=calcH(getT('f-start'),getT('f-end')),t=num($('#f-tips').value);
  p.innerHTML=`<div><span>שעות</span><b>${h>0?hrs(h):'—'}</b></div><div><span>סה"כ טיפים</span><b>${money(t)}</b></div><div><span>טיפים לשעה</span><b>${h>0?money(t/h):'—'}</b></div>`;
}
function saveForm(){
  const date=$('#f-date').value,start=getT('f-start'),end=getT('f-end');
  if(!DATE_RE.test(date)){toast('יש לבחור תאריך');return}
  if(pt(start)===null||pt(end)===null){toast('שעה לא תקינה, למשל 18:00');return}
  if(calcH(start,end)<=0){toast('שעת הסיום זהה לשעת ההתחלה');return}
  const rec={id:editId||uid(),date,start,end,cash:r2(num($('#f-tips').value))};
  const i=editId?S.shifts.findIndex(x=>x.id===editId):-1;
  if(i>=0)S.shifts[i]=rec;else S.shifts.push(rec);
  S.last={start,end};
  const d=pd(date);vy=d.getFullYear();vm=d.getMonth();
  persist();closeSheet();render();toast('המשמרת נשמרה');
}
function openDay(date){
  const list=S.shifts.filter(s=>s.date===date).sort((a,b)=>a.start.localeCompare(b.start));
  if(!list.length){openForm(null,date);return}
  openSheet(`<h2>${dlabel(date,{weekday:'long',day:'numeric',month:'long'})}</h2>${dayStatusHTML(date,'')}<div class="list">`+
    list.map(s=>`<button class="row" data-a="edit" data-id="${s.id}"><span class="m"><b>${rng(s)}</b>${hrs(calcH(s.start,s.end))} שעות</span><span class="tp">${money(s.cash||0)}</span><span class="ed">עריכה</span>${CHEV}</button>`).join('')+
    `</div><button class="btn primary" data-a="adddate" data-d="${date}">הוספת משמרת ליום הזה</button><button class="btn ghost" data-a="close">סגירה</button>`);
}
function openSettings(){
  openSheet(`<h2>הגדרות</h2>
  <div class="group">
    <label class="field">שכר מינימום לשעה (₪)<input type="number" id="s-min" inputmode="decimal" min="0" step="any" value="${S.settings.minWage}"></label>
    <label class="field">נסיעות ליום עבודה (₪)<input type="number" id="s-travel" inputmode="decimal" min="0" step="any" value="${S.settings.travel||''}" placeholder="0"></label>
  </div>
  <p class="note">ההגדרות נשמרות אוטומטית והחישוב מתעדכן מיד.</p>
  <h3>גיבוי</h3>
  <div class="list"><button class="row act" data-a="export">ייצוא גיבוי (JSON)</button><button class="row act" data-a="import">ייבוא מגיבוי</button></div>
  <button class="btn primary" data-a="close">סיום</button>`);
}

/* ---------- summary / backup ---------- */
function summaryText(){
  const c=calc(vy,vm),name=new Date(vy,vm,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});
  const L=[`*סיכום משמרות – ${name}*`,''];
  c.list.forEach(s=>L.push(`• ${dlabel(s.date,{weekday:'short',day:'numeric',month:'numeric'})}: ${rng(s)} (${hrs(calcH(s.start,s.end))} שעות), טיפים ${money(s.cash||0)}`));
  L.push('','*סיכום*',
    `סה"כ שעות: ${hrs(c.hours)} (${c.days} ימי עבודה)`,
    `סה"כ טיפים (מזומן ביד): ${money(c.tips)}`,
    `שכר מינימום לשעות: ${money(c.required)}`,
    `החזרי נסיעות: ${money(c.travel)}`,
    `קיזוז בגלל הטיפים: ${money(c.offset)}`,
    `צפי לתלוש: ${money(c.pay)}`,
    `ממוצע נטו לשעה: ${money(c.net)}`);
  return L.join('\n');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'shift-wage',version:2,exported:new Date().toISOString(),settings:S.settings,shifts:S.shifts},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`shifts-backup-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('קובץ הגיבוי נוצר');
}
let pending=null;
function pickFile(){
  const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
  i.style.cssText='position:fixed;left:-9999px;opacity:0';
  i.onchange=()=>{const f=i.files[0];i.remove();if(f)importData(f)};
  document.body.appendChild(i);i.click();
}
async function importData(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j||!Array.isArray(j.shifts))throw 0;
    pending={shifts:j.shifts.map(normShift).filter(Boolean),settings:j.settings};
    openSheet(`<h2>שחזור מגיבוי</h2><p class="note">נמצאו ${pending.shifts.length} משמרות. השחזור מחליף את כל הנתונים הקיימים במכשיר.</p><button class="btn dfill" data-a="importyes">שחזור והחלפה</button><button class="btn plain" data-a="close">ביטול</button>`);
  }catch(e){toast('הקובץ לא תקין')}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='backdrop'){if(e.target===sheet)closeSheet();return}
  switch(a){
    case 'prev':vm--;if(vm<0){vm=11;vy--}render();break;
    case 'next':vm++;if(vm>11){vm=0;vy++}render();break;
    case 'today':vy=now.getFullYear();vm=now.getMonth();render();break;
    case 'add':openForm(null,null);break;
    case 'adddate':openForm(null,t.dataset.d);break;
    case 'day':openDay(t.dataset.d);break;
    case 'edit':openForm(t.dataset.id);break;
    case 'save':saveForm();break;
    case 'del':$('#delbox').innerHTML='<div class="group"><div class="ask">למחוק את המשמרת הזו?</div></div><div class="r2"><button class="btn plain" data-a="delno">ביטול</button><button class="btn dfill" data-a="delyes">מחיקה</button></div>';break;
    case 'delno':$('#delbox').innerHTML=delBtn;break;
    case 'delyes':S.shifts=S.shifts.filter(x=>x.id!==editId);persist();closeSheet();render();toast('המשמרת נמחקה');break;
    case 'close':closeSheet();break;
    case 'settings':openSettings();break;
    case 'copy':copyText(summaryText()).then(ok=>toast(ok?'הסיכום הועתק':'ההעתקה נכשלה'));break;
    case 'export':exportData();break;
    case 'import':pickFile();break;
    case 'importyes':
      if(pending){S.shifts=pending.shifts;if(pending.settings)S.settings={minWage:num(pending.settings.minWage),travel:num(pending.settings.travel)};pending=null;persist();closeSheet();render();toast('הגיבוי נטען')}
      break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,id=el.id;if(!id)return;
  if(id.startsWith('f-'))preview();
  else if(id==='s-min'){S.settings.minWage=num(el.value);persist();render()}
  else if(id==='s-travel'){S.settings.travel=num(el.value);persist();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- PWA ---------- */
function icon(sz){
  const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#BDAEF6');g.addColorStop(.4,'#F5A9D2');g.addColorStop(.72,'#FAB67E');g.addColorStop(1,'#F8DA7B');
  x.fillStyle=g;x.fillRect(0,0,sz,sz);
  x.fillStyle='#fff';x.font=`800 ${sz*.5}px -apple-system,sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.fillText('₪',sz/2,sz/2+sz*.03);
  return c.toDataURL('image/png');
}
try{
  const base=location.href.split('#')[0].split('?')[0];
  const m={name:'משמרות ושכר',short_name:'משמרות',lang:'he',dir:'rtl',display:'standalone',orientation:'portrait',background_color:'#F2F2F7',theme_color:'#F2F2F7',start_url:base,scope:base.slice(0,base.lastIndexOf('/')+1),
    icons:[{src:icon(192),sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:icon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
  const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=icon(180);document.head.appendChild(ap);
}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
})();
</script>
</body>
